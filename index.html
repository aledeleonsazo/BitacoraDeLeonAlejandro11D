<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Alejandro de León</title>
    <link rel="icon" href="recursos/img/LOGO_CAPOUILLIEZ - Isotipos (2)-08 (1).png" style="image/png">
    <style>
        /*CSS-lenguaje de programacion(Diseñar en cascada)*/
        html, body{
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
    body{
        display: flex;
        flex-direction: column;
        text-align: center;
    }
    header{
        padding: 20px;
        background-color: rgb(1, 145, 255);
        color: azure;
    }
    main{
        flex: 1;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
        background-color: rgb(0, 0, 0);
    }
    footer{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 50px;
        border-top: 1px solid rgb(0, 0, 0);
        background-color: rgb(255, 188, 31);
        }
        @media(max-widht:600px){
            footer{
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
        }
        main h1{
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow:
                0 0 5px white
                0 0 10px white
                0 0 20px white
                0 0 40px red
        }
    </style>
</head>
<body>
    <header>
<h1>Bitacora Segunda y tercera Unidad</h1>
    </header>
    <main>
<h4>Contenido de a pagina Web</h4>
    </main>
    <footer>
<span>@slmcoco_</span>
<img src="https://www.capouilliez.edu.gt/assets/img/logo.png"height="50" width="200">
    </footer>
</body>
</html>
